# Render deployment blueprint (backend only).
# The Next.js frontend is deployed separately on Vercel.
#
# Free plan notes:
#   - No persistent disk, so the SQLite files reset whenever the service restarts.
#   - The service sleeps after 15 minutes of inactivity; the next request takes ~1 minute.
#   - Secrets marked "sync: false" are entered in the Render dashboard, never in this file.

services:
  - type: web
    name: orion-backend
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: EMAIL_SENDER_NAME
        value: "ORION-Health"
      - key: EMAIL_SENDER
        sync: false      # set in the Render dashboard
      - key: BREVO_API_KEY
        sync: false      # set in the Render dashboard
