<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ORION Health – Patient Intake</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      padding: 12px;
      width: 100%;
      border: none;
      background: #1976d2;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0d47a1;
    }

    .suggestions {
      background: white;
      border: 1px solid #ccc;
      max-height: 150px;
      overflow-y: auto;
      position: absolute;
      width: 95%;
      z-index: 999;
    }

    .suggestions div {
      padding: 8px;
      cursor: pointer;
    }

    .suggestions div:hover {
      background: #e3f2fd;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>🏥 ORION Health – Patient Intake</h2>

  <label>Patient Name</label>
  <input id="name" placeholder="Start typing patient name..." oninput="searchPatient(this.value)">
  <div id="suggestions" class="suggestions"></div>

  <div class="row">
    <div>
      <label>Age</label>
      <input id="age">
    </div>
    <div>
      <label>SpO2</label>
      <input id="spo2">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Temperature</label>
      <input id="temperature">
    </div>
    <div>
      <label>Pain Score</label>
      <input id="pain_score">
    </div>
  </div>

  <div class="row">
    <div>
      <label>Duration (Hours)</label>
      <input id="duration_hours">
    </div>
    <div>
      <label>Chronic Disease (0/1)</label>
      <input id="chronic_disease">
    </div>
  </div>

  <label>Red Flag (0/1)</label>
  <input id="red_flag">

  <label>Problem / Complaint</label>
  <input id="verbal_problem">

  <label>Doctor Email (Optional)</label>
  <input id="doctor_email">

  <label>Emergency</label>
  <input id="emergency" placeholder="true / false">

  <button onclick="submitPatient()">Submit Triage</button>
</div>

<script>
const API = "http://127.0.0.1:8000/api";

async function searchPatient(query) {
  if (query.length < 2) {
    document.getElementById("suggestions").innerHTML = "";
    return;
  }

  const res = await fetch(`${API}/preregister/search/${query}`);
  const data = await res.json();

  let html = "";
  data.forEach(p => {
    html += `<div onclick='selectPatient(${JSON.stringify(p)})'>${p.patient_name} (${p.age})</div>`;
  });

  document.getElementById("suggestions").innerHTML = html;
}

function selectPatient(p) {
  document.getElementById("name").value = p.patient_name;
  document.getElementById("age").value = p.age;
  document.getElementById("verbal_problem").value = p.problem;

  document.getElementById("suggestions").innerHTML = "";
}

async function submitPatient() {
  const payload = {
    name: document.getElementById("name").value,
    age: parseInt(document.getElementById("age").value || 0),
    spo2: parseInt(document.getElementById("spo2").value || 98),
    temperature: parseFloat(document.getElementById("temperature").value || 36.5),
    pain_score: parseInt(document.getElementById("pain_score").value || 0),
    duration_hours: parseInt(document.getElementById("duration_hours").value || 0),
    chronic_disease: parseInt(document.getElementById("chronic_disease").value || 0),
    red_flag: parseInt(document.getElementById("red_flag").value || 0),
    verbal_problem: document.getElementById("verbal_problem").value,
    doctor_email: document.getElementById("doctor_email").value,
    emergency: document.getElementById("emergency").value === "true"
  };

  const res = await fetch(`${API}/patient/submit`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();
  alert("Submitted Successfully!\n\n" + JSON.stringify(data, null, 2));
}
</script>

</body>
</html>
